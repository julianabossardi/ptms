backend:
  name: github
  repo: julianabossardi/ptms
  branch: main
  # base_url e auth_endpoint são definidos em public/admin/index.html

# Em localhost, com `npx decap-server` rodando, edita os arquivos locais sem login.
local_backend: true

locale: pt

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: projects
    label: "Projetos"
    label_singular: "Projeto"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    sortable_fields: [ordem, titulo]
    fields:
      - { name: titulo, label: "Título", widget: string }
      - { name: cliente, label: "Cliente", widget: string }
      - { name: periodo, label: "Período", widget: string,
          hint: "Texto livre — aceita '2025' ou '2025 - hoje'" }
      - { name: ordem, label: "Ordem de exibição", widget: number,
          value_type: int, hint: "Menor número aparece primeiro" }
      - { name: pagina, label: "Tem página própria", widget: boolean, default: true,
          hint: "Desmarcado: o projeto aparece na lista do Work, em cinza e sem link" }
      - { name: capa, label: "Imagem de capa", widget: image, required: false,
          hint: "Obrigatória quando o projeto tem página própria" }
      - { name: descricao_pt, label: "Descrição (PT)", widget: markdown,
          required: false, hint: "Obrigatória quando o projeto tem página própria" }
      - { name: descricao_en, label: "Descrição (EN)", widget: markdown,
          required: false }
      - name: creditos
        label: "Créditos"
        widget: list
        required: false
        fields:
          - { name: funcao, label: "Função", widget: string }
          - { name: nome, label: "Nome", widget: string }
      - name: galeria
        label: "Galeria"
        widget: list
        required: false
        field: { name: imagem, label: "Imagem", widget: image }
      - name: seo
        label: "SEO"
        widget: object
        collapsed: true
        required: false
        fields:
          - { name: titulo, label: "Título", widget: string, required: false,
              hint: "Aparece no Google e ao compartilhar. Vazio: usa o título acima" }
          - { name: descricao, label: "Descrição", widget: text, required: false,
              hint: "Um ou dois períodos, até 160 caracteres" }
          - { name: slug, label: "Endereço (slug)", widget: string, required: false,
              hint: "Só letras, números e hífens. Vazio: usa o nome do arquivo. Mudar quebra os links já divulgados" }

  - name: ptms
    label: "PTMS"
    label_singular: "Post"
    folder: "content/ptms"
    create: true
    slug: "{{slug}}"
    sortable_fields: [data, titulo]
    fields:
      - { name: titulo, label: "Título", widget: string,
          hint: "Pode conter emoji" }
      - { name: data, label: "Data", widget: datetime,
          date_format: "DD/MM/YYYY", time_format: false,
          format: "YYYY-MM-DD" }
      - { name: thumb, label: "Miniatura (hover na listagem)", widget: image }
      - { name: corpo, label: "Conteúdo", widget: markdown }
      - name: seo
        label: "SEO"
        widget: object
        collapsed: true
        required: false
        fields:
          - { name: titulo, label: "Título", widget: string, required: false,
              hint: "Aparece no Google e ao compartilhar. Vazio: usa o título acima" }
          - { name: descricao, label: "Descrição", widget: text, required: false,
              hint: "Um ou dois períodos, até 160 caracteres" }
          - { name: slug, label: "Endereço (slug)", widget: string, required: false,
              hint: "Só letras, números e hífens. Vazio: usa o nome do arquivo. Mudar quebra os links já divulgados" }

  - name: paginas
    label: "Páginas"
    files:
      - name: home
        label: "Home"
        file: "content/pages/home.md"
        fields:
          - { name: nome, label: "Nome", widget: string }
          - name: cargos
            label: "Cargos (abaixo do nome)"
            widget: list
            max: 3
            hint: "Até três: o primeiro à esquerda, o segundo no centro e o terceiro à direita"
            field: { name: cargo, label: "Cargo", widget: string }
          - { name: ptms_frase, label: "Frase ao lado do PTMS", widget: string,
              required: false,
              hint: "Aparece no canto oposto ao PTMS, na seção branca da Home" }
          # O anel de fotos da Home usa as capas dos projetos com página própria.
          - name: seo
            label: "SEO"
            widget: object
            collapsed: true
            required: false
            hint: "O endereço desta página é fixo; aqui ficam título e descrição"
            fields:
              - { name: titulo, label: "Título", widget: string, required: false,
                  hint: "Aparece no Google e ao compartilhar. Vazio: usa o nome da página" }
              - { name: descricao, label: "Descrição", widget: text, required: false,
                  hint: "Um ou dois períodos, até 160 caracteres" }

      - name: work
        label: "Work (listagem)"
        file: "content/pages/work.md"
        fields:
          - name: seo
            label: "SEO"
            widget: object
            collapsed: true
            required: false
            hint: "O endereço desta página é fixo; aqui ficam título e descrição"
            fields:
              - { name: titulo, label: "Título", widget: string, required: false,
                  hint: "Aparece no Google e ao compartilhar. Vazio: usa o nome da página" }
              - { name: descricao, label: "Descrição", widget: text, required: false,
                  hint: "Um ou dois períodos, até 160 caracteres" }

      - name: about
        label: "About"
        file: "content/pages/about.md"
        fields:
          - { name: texto_pt, label: "Bio (PT)", widget: markdown }
          - { name: texto_en, label: "Bio (EN)", widget: markdown,
              required: false }
          - name: imagens
            label: "Foto do topo"
            hint: "O topo do About usa a primeira imagem da lista."
            widget: list
            required: false
            field: { name: imagem, label: "Imagem", widget: image }
          - name: reportagens
            label: "Press (reportagens)"
            label_singular: "Reportagem"
            widget: list
            required: false
            fields:
              - { name: titulo, label: "Título", widget: string }
              - { name: subtitulo, label: "Subtítulo", widget: string,
                  required: false,
                  hint: "Veículo, formato e ano. Ex: Elle Brasil · Entrevista · 2022" }
              - { name: imagem, label: "Imagem", widget: image, required: false,
                  hint: "Sem imagem, o card mostra um espaço reservado" }
              - { name: link, label: "Link da matéria", widget: string,
                  required: false, hint: "Sem link, o card não é clicável" }
          - name: seo
            label: "SEO"
            widget: object
            collapsed: true
            required: false
            hint: "O endereço desta página é fixo; aqui ficam título e descrição"
            fields:
              - { name: titulo, label: "Título", widget: string, required: false,
                  hint: "Aparece no Google e ao compartilhar. Vazio: usa o nome da página" }
              - { name: descricao, label: "Descrição", widget: text, required: false,
                  hint: "Um ou dois períodos, até 160 caracteres" }

      - name: contact
        label: "Contact"
        file: "content/pages/contact.md"
        fields:
          - { name: titulo, label: "Título", widget: string }
          - { name: corpo, label: "Conteúdo", widget: markdown, required: false }
          - { name: email, label: "E-mail", widget: string }
          - { name: telefone, label: "Telefone", widget: string, required: false,
              hint: "Aparece no Contact e no rodapé" }
          - name: seo
            label: "SEO"
            widget: object
            collapsed: true
            required: false
            hint: "O endereço desta página é fixo; aqui ficam título e descrição"
            fields:
              - { name: titulo, label: "Título", widget: string, required: false,
                  hint: "Aparece no Google e ao compartilhar. Vazio: usa o nome da página" }
              - { name: descricao, label: "Descrição", widget: text, required: false,
                  hint: "Um ou dois períodos, até 160 caracteres" }

      - name: ptms
        label: "PTMS (listagem)"
        file: "content/pages/ptms.md"
        fields:
          - { name: subtitulo, label: "Subtítulo", widget: string,
              hint: "Aparece abaixo do PTMS, com uma seta; clicar abre o texto abaixo" }
          - { name: descricao, label: "Texto do subtítulo", widget: text,
              hint: "Parágrafo curto, de até 3 linhas, sobre o PTMS" }
          - name: seo
            label: "SEO"
            widget: object
            collapsed: true
            required: false
            hint: "O endereço desta página é fixo; aqui ficam título e descrição"
            fields:
              - { name: titulo, label: "Título", widget: string, required: false,
                  hint: "Aparece no Google e ao compartilhar. Vazio: usa o nome da página" }
              - { name: descricao, label: "Descrição", widget: text, required: false,
                  hint: "Um ou dois períodos, até 160 caracteres" }

  - name: config
    label: "Configurações"
    files:
      - name: global
        label: "Global"
        file: "content/config/global.md"
        fields:
          - name: redes
            label: "Redes sociais"
            widget: list
            fields:
              - { name: rotulo, label: "Rótulo", widget: string,
                  hint: "Aparece ao lado do logo da rede. Ex: @vieirachel" }
              - { name: url, label: "URL", widget: string }
          - { name: og_image, label: "Imagem de compartilhamento",
              widget: image }
