<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>CMS · Rachel Oliveira Vieira</title>
    <!-- Caminho absoluto: em /admin (sem barra) o Decap buscaria /config.yml. -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@3.16.2/dist/decap-cms.js"></script>
    <script>
      // O resto da config vem de config.yml. O OAuth roda nas rotas
      // /api/auth e /api/callback deste mesmo site, em qualquer domínio.
      CMS.init({
        config: {
          backend: {
            base_url: window.location.origin,
            auth_endpoint: "api/auth",
          },
        },
      });
    </script>
  </body>
</html>
